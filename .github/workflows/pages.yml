# Veröffentlicht die Website auf GitHub Pages, sobald sich etwas auf main ändert
# (zum Beispiel nach dem Bearbeiten von daten.js im Browser).
name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prüfen, ob daten.js gültig ist
        run: node -e "global.window={}; require('./daten.js'); if(!window.MK_DATEN) process.exit(1); console.log('daten.js ok')"
      - name: Website-Dateien zusammenstellen
        run: mkdir _site && cp index.html daten.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
