# Veröffentlicht die Website auf GitHub Pages, sobald sich etwas auf main ändert
# (zum Beispiel nach dem Bearbeiten von daten.js im Browser).
name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.versuch1.outputs.page_url || steps.versuch2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Prüfen, ob daten.js gültig ist
        run: node -e "global.window={}; require('./daten.js'); if(!window.MK_DATEN) process.exit(1); console.log('daten.js ok')"
      - name: Skripte auf Syntaxfehler prüfen
        run: for f in js/*.js sw.js; do node --check "$f" || exit 1; done
      - name: Website-Dateien zusammenstellen
        run: mkdir _site && cp -r index.html style.css daten.js js icons manifest.webmanifest sw.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      # Veröffentlichen; bei einer kurzen Störung von GitHub einmal nach 30 Sekunden wiederholen
      - id: versuch1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Kurz warten vor zweitem Versuch
        if: steps.versuch1.outcome == 'failure'
        run: sleep 30
      - id: versuch2
        if: steps.versuch1.outcome == 'failure'
        uses: actions/deploy-pages@v4
